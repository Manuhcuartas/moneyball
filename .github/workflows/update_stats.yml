name: Update Weekly Stats

on:
  schedule:
    # Games are typically on weekends in FBPA
    # Run Monday and Thursday at 07:00 AM UTC (08:00 CET / 09:00 CEST)
    - cron: "0 7 * * 1,4"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FBPA_BASE_URL: ${{ secrets.FBPA_BASE_URL }}
          FBPA_ID_DISPOSITIVO: ${{ secrets.FBPA_ID_DISPOSITIVO }}
          FBPA_ID_FASE: ${{ secrets.FBPA_ID_FASE }}
          FBPA_ID_GRUPO: ${{ secrets.FBPA_ID_GRUPO }}
          FBPA_ID_EQUIPO_PROPIO: ${{ secrets.FBPA_ID_EQUIPO_PROPIO }}
          FBPA_DEVICE_UID: ${{ secrets.FBPA_DEVICE_UID }}
          FBPA_PUSH_TOKEN: ${{ secrets.FBPA_PUSH_TOKEN }}
          FBPA_LOGIN_URL: ${{ secrets.FBPA_LOGIN_URL }}
          FBPA_APP_VERSION: ${{ secrets.FBPA_APP_VERSION }}
        run: python run_crawler.py
